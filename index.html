<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('Backgroundwp.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            margin: 0;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-color: rgba(18, 18, 18, 0.75); 
            backdrop-filter:none; 
            z-index: -1;
        }

        .GirisEkranCard {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background-color: rgba(26, 26, 46, 0.85); 
            border-radius: 1.5rem; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .GirisEkranCard button[type="submit"] {
            background-color: #ffc107; 
            color: #000;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }

        .GirisEkranCard button[type="submit"]:hover {
            background-color: #ffca2c;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="GirisEkranCard text-center">
        <div class="mb-3">
            <img src="No way out.jpg" alt="Logo" width="80" height="80" class="rounded-circle mb-2 shadow" style="object-fit: cover;" onerror="this.style.display='none'">
            <h3 class="fw-bold text-warning">LunarTech</h3>
            <h5 class="card-title text-light mt-2">Giriş Yap</h5>
        </div>

        <form action="index2.html" method="get">
            <div class="mb-3 text-start">
                <label for="mail" class="form-label text-light">E-posta</label>
                <input type="email" class="form-control bg-dark text-light border-secondary" id="mail" name="mail" placeholder="ornek@lunartech.com" required>
            </div>

            <div class="mb-4 text-start">
                <label for="password" class="form-label text-light">Şifre</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="admin123." required>
            </div>

            <button type="submit" class="btn w-100 py-2">Giriş Yap</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
